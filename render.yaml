services:
  - type: web
    name: signalai-connectors
    runtime: python
    plan: starter
    buildCommand: pip install .
    startCommand: uvicorn signalai_connectors.app:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    envVars:
      - key: SIGNALAI_REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: SIGNALAI_MAX_RESPONSE_BYTES
        value: "5000000"
      - key: SIGNALAI_MAX_CONCURRENCY
        value: "50"
